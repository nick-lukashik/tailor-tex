# The service in its image, as in Kubernetes (read-only root, /tmp only, uid
# 10001), for a machine without TeX Live: pnpm docker:up | docker:down.
# INTERNAL_API_TOKEN comes from .env (pnpm env:local); the value there is local-only.
name: tailor-tex

services:
    tailor-tex:
        build: .
        image: tailor-tex:local
        read_only: true
        tmpfs:
            - /tmp
        user: "10001:10001"
        cap_drop: [ALL]
        security_opt: [no-new-privileges]
        environment:
            INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        ports: ["4000:3000", "9464:9464"]
