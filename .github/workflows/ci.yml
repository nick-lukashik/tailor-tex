name: ci

# The org reusable workflows (nick-lukashik/.github, docs/ci.md): pnpm verify
# and the image, then the gitops deploy PR. No service containers: tailor-tex
# has no database. The runner has no xelatex, so the TeX tests skip there; the
# image build runs xelatex -version and pdftotext -v.
# Referenced by the moving major tag @v1, never @master (service contract);
# breaking changes go to @v2.

on:
    pull_request:
    push:
        branches: [master]

permissions: {}

jobs:
    # Job id "ci" gives the required check "ci / verify".
    ci:
        uses: nick-lukashik/.github/.github/workflows/build.yml@v1
        permissions:
            contents: read
            packages: write
        with:
            kind: api
            # The template itself only checks; a repo created from it publishes its image.
            publish: ${{ !github.event.repository.is_template }}

    # Pushed image on master: a PR in gitops with the new digest.
    deploy:
        needs: ci
        if: github.ref == 'refs/heads/master' && needs.ci.outputs.digest != ''
        uses: nick-lukashik/.github/.github/workflows/deploy-pr.yml@v1
        permissions:
            contents: read
            packages: read
        with:
            image: ${{ needs.ci.outputs.image }}
            digest: ${{ needs.ci.outputs.digest }}
        # Only what deploy-pr.yml needs (least privilege, no secrets: inherit).
        secrets:
            DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
            DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
            OPS_TELEGRAM_TOKEN: ${{ secrets.OPS_TELEGRAM_TOKEN }}
